[project]
name = "knowledge-sprite"
version = "0.1.0"
description = "Evidence-based live course and video discovery"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
