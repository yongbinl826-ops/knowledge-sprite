# Local-only instance. JSON must be explicitly enabled.
use_default_settings:
  engines:
    remove:
      - youtube
      - bilibili
general:
  instance_name: "Knowledge Sprite Local Search"
search:
  formats:
    - html
    - json
  safe_search: 1
server:
  secret_key: "REPLACED_BY_SETUP_SCRIPT"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
outgoing:
  request_timeout: 8.0
